name: Build and test on PR
'on': pull_request
jobs:
  build:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    # The Cypress tests of all PRs share the cypress-testing Firebase
    # project, and each spec starts by deleting its movements: a run
    # waits for the one in progress instead of running alongside it
    concurrency:
      group: cypress-testing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:app
      - run: npm run cy:test
      # The movement specs again, with the app built with
      # movementWritesViaApi (projects/cypress-testing-api.json), plus the
      # specs of cypress/integration/movements_api
      - run: npm run cy:test:api
  build_functions:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: cd functions && npm ci
      - run: cd functions && npm test
